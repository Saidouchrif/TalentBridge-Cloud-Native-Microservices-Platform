name: CI/CD Pipeline - TalentBridge Microservices

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: [entreprise-service, offre-service]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        cd ${{ matrix.service }}
        npm ci
        
    - name: Run linting
      run: |
        cd ${{ matrix.service }}
        npm run lint
        
    - name: Run tests
      run: |
        cd ${{ matrix.service }}
        npm test
        
    - name: Run API tests
      run: |
        cd ${{ matrix.service }}
        npm run test:api

  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        cd entreprise-service
        npm ci
        cd ../offre-service
        npm ci
        
    - name: Security audit
      run: |
        cd entreprise-service
        npm audit --audit-level=high
        cd ../offre-service
        npm audit --audit-level=high

  build-frontend:
    runs-on: ubuntu-latest
    needs: test
    
    strategy:
      matrix:
        service: [entreprise-service, offre-service]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        cd ${{ matrix.service }}/frontend
        npm ci
        
    - name: Build frontend
      run: |
        cd ${{ matrix.service }}/frontend
        npm run build
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.service }}-frontend
        path: ${{ matrix.service }}/frontend/dist

  integration-test:
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        cd entreprise-service
        npm ci
        cd ../offre-service
        npm ci
        
    - name: Start services
      run: |
        cd entreprise-service
        npm start &
        sleep 10
        
        cd ../offre-service
        npm start &
        sleep 10
        
    - name: Test inter-service communication
      run: |
        # Test entreprise-service
        curl -f http://localhost:5002/health
        
        # Test offre-service
        curl -f http://localhost:5003/health
        
        # Test communication inter-services
        curl -f http://localhost:5003/api/enterprises/1/exists

  deploy:
    runs-on: ubuntu-latest
    needs: [test, security, build-frontend, integration-test]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your deployment commands here
        
    - name: Deploy to production
      if: success()
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
