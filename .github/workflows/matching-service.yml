name: matching-service

on:
  push:
    paths:
      - "Dev/Microservices/Matching-service/**"
      - ".github/workflows/matching-service.yml"
  pull_request:
    paths:
      - "Dev/Microservices/Matching-service/**"
      - ".github/workflows/matching-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-build-push:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: matching_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d matching_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: Dev/Microservices/Matching-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Dev/Microservices/Matching-service/package-lock.json

      - name: Verify tests folder
        run: test -d tests

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/matching_test
          DATABASE_URL: postgresql://test:test@localhost:5432/matching_test
          JWT_SECRET: ci_jwt_secret
          JWT_ALGORITHM: HS256
          SECRET_KEY: ci_jwt_secret
          ALGORITHM: HS256
          MATCHING_SERVICE_TOKEN: ci_matching_token
          STUDENT_SERVICE_URL: http://127.0.0.1:9
          OFFRES_SERVICE_URL: http://127.0.0.1:9
          CANDIDATURE_SERVICE_URL: http://127.0.0.1:9
        run: npm test -- --silent

      - name: Set image vars
        id: vars
        shell: bash
        run: |
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner_lc }}/talentbridge-matching-service
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: Dev/Microservices/Matching-service
          file: Dev/Microservices/Matching-service/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

