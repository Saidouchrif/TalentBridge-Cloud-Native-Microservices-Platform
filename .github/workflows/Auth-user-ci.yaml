name: Auth-User CI

on:
  push:
    paths:
      - "Dev/Microservices/Auth-User-service/**"
      - "Code/Microservices/Auth-User-service/**"
      - ".github/workflows/Auth-user-ci.yaml"
  pull_request:
    paths:
      - "Dev/Microservices/Auth-User-service/**"
      - "Code/Microservices/Auth-User-service/**"
      - ".github/workflows/Auth-user-ci.yaml"

jobs:
  tests-auth-user-service:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Localiser le dossier du service
        id: locate
        shell: bash
        run: |
          if [ -d "Dev/Microservices/Auth-User-service" ]; then
            echo "service_dir=Dev/Microservices/Auth-User-service" >> "$GITHUB_OUTPUT"
          elif [ -d "Code/Microservices/Auth-User-service" ]; then
            echo "service_dir=Code/Microservices/Auth-User-service" >> "$GITHUB_OUTPUT"
          else
            echo "Auth-User-service introuvable dans Dev/ ou Code/"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ${{ steps.locate.outputs.service_dir }}/requirements.txt

      - name: Installer les dependances
        working-directory: ${{ steps.locate.outputs.service_dir }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verification syntaxe Python
        working-directory: ${{ steps.locate.outputs.service_dir }}
        shell: bash
        run: |
          python -m compileall .

      - name: Lancer les tests pytest
        working-directory: ${{ steps.locate.outputs.service_dir }}
        shell: bash
        env:
          DATABASE_URL: sqlite:///./ci_test_auth_service.db
          SECRET_KEY: ci_secret_key
          REFRESH_SECRET_KEY: ci_refresh_secret_key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_HOURS: "1"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
        run: |
          pytest -q --maxfail=1
