name: Auth-User CI

on:
  push:
    paths:
      - "Code/Microservices/Auth-User-service/**"
      - ".github/workflows/Auth-user-ci.yaml"
  pull_request:
    paths:
      - "Code/Microservices/Auth-User-service/**"
      - ".github/workflows/Auth-user-ci.yaml"

jobs:
  tests-auth-user-service:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: Code/Microservices/Auth-User-service

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Code/Microservices/Auth-User-service/requirements.txt

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verification syntaxe Python
        run: |
          python -m compileall .

      - name: Lancer les tests pytest
        env:
          DATABASE_URL: sqlite:///./ci_test_auth_service.db
          SECRET_KEY: ci_secret_key
          REFRESH_SECRET_KEY: ci_refresh_secret_key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_HOURS: "1"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
        run: |
          pytest -q --maxfail=1
