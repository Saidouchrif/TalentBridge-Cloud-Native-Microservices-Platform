name: Etudiant Service CI

on:
  push:
    paths:
      - "Dev/Microservices/Etudiant-service/**"
      - "Code/Microservices/Etudiant-service/**"
      - ".github/workflows/etudiant-service.yml"
  pull_request:
    paths:
      - "Dev/Microservices/Etudiant-service/**"
      - "Code/Microservices/Etudiant-service/**"
      - ".github/workflows/etudiant-service.yml"

jobs:
  test-et-build-docker:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: etudiant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d etudiant_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Localiser le dossier du service
        id: locate
        shell: bash
        run: |
          if [ -d "Dev/Microservices/Etudiant-service" ]; then
            echo "service_dir=Dev/Microservices/Etudiant-service" >> "$GITHUB_OUTPUT"
          elif [ -d "Code/Microservices/Etudiant-service" ]; then
            echo "service_dir=Code/Microservices/Etudiant-service" >> "$GITHUB_OUTPUT"
          else
            echo "Etudiant-service introuvable dans Dev/ ou Code/"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ steps.locate.outputs.service_dir }}/package-lock.json

      - name: Installer les dependances
        working-directory: ${{ steps.locate.outputs.service_dir }}
        run: npm ci

      - name: Lancer les tests
        working-directory: ${{ steps.locate.outputs.service_dir }}
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/etudiant_test
          JWT_SECRET: ci_jwt_secret_etudiant
          JWT_ALGORITHM: HS256
        run: npm test

      - name: Build image Docker
        working-directory: ${{ steps.locate.outputs.service_dir }}
        run: docker build -t etudiant-service:ci .
