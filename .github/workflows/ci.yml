# Pipeline unifie : tests + build Docker pour les microservices TalentBridge (dossier Dev/).
name: CI for Microservices TalentBridge

on:
  push:
    paths:
      - "Dev/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Dev/**"
      - ".github/workflows/ci.yml"

env:
  DEV_ROOT: Dev/Microservices

jobs:
  auth-user-service:
    name: Auth-User-service (pytest + Docker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.DEV_ROOT }}/Auth-User-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ env.DEV_ROOT }}/Auth-User-service/requirements.txt

      - name: Dependances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntaxe Python
        run: python -m compileall .

      - name: Tests pytest
        env:
          DATABASE_URL: sqlite:///./ci_test_auth_service.db
          SECRET_KEY: ci_secret_key
          REFRESH_SECRET_KEY: ci_refresh_secret_key
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_HOURS: "1"
          REFRESH_TOKEN_EXPIRE_DAYS: "7"
        run: pytest -q

      - name: Build image Docker
        run: docker build -t talentbridge-auth-user-service:ci .

  node-service-ci:
    name: "${{ matrix.service }}"
    runs-on: ubuntu-latest
    needs: []
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: Etudiant-service
            db: etudiant_test
          - service: Entreprise-service
            db: entreprise_test
          - service: Offres-service
            db: job_test
          - service: Candidature-service
            db: application_test
          - service: Notification-service
            db: notification_test
          - service: AI-Document-service
            db: document_test
          - service: Matching-service
            db: matching_test

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ${{ matrix.db }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d ${{ matrix.db }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: ${{ env.DEV_ROOT }}/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ env.DEV_ROOT }}/${{ matrix.service }}/package-lock.json

      - name: npm ci
        run: npm ci

      - name: Tests Jest
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/${{ matrix.db }}
          DATABASE_URL: postgresql://test:test@localhost:5432/${{ matrix.db }}
          JWT_SECRET: ci_jwt_secret_unified
          JWT_ALGORITHM: HS256
          SECRET_KEY: ci_jwt_secret_unified
          ALGORITHM: HS256
          SERVICE_INTERNAL_TOKEN: ci_service_token
          NOTIFICATION_INTERNAL_TOKEN: ci_notify_token
          MATCHING_SERVICE_TOKEN: ci_matching_token
          NOTIFICATION_SERVICE_URL: http://127.0.0.1:9
          OFFRES_SERVICE_URL: http://127.0.0.1:9
          CANDIDATURE_SERVICE_URL: http://127.0.0.1:9
          STUDENT_SERVICE_URL: http://127.0.0.1:9
          AI_API_KEY: ""
          AI_PROVIDER: gemini
        run: npm test

      - name: Build image Docker
        run: docker build -t talentbridge-${{ matrix.service }}:ci .
