services:
  postgres_db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: talentbridge_user
      POSTGRES_PASSWORD: talentbridge_password
      POSTGRES_DB: user_db
    ports:
      - "5432:5432"
    volumes:
      - talentbridge_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: talentbridge-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@talentbridge.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres_db

  auth-user-service:
    build: ./Microservices/Auth-User-service
    container_name: auth-user-service
    ports:
      - "8000:8000"
    env_file:
      - ./Microservices/Auth-User-service/.env
    volumes:
      - ./Microservices/Auth-User-service:/app
    depends_on:
      - postgres_db
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: talentbridge-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - auth-user-service
    restart: unless-stopped

volumes:
  talentbridge_pgdata:
  pgadmin_data:
  frontend_node_modules:
